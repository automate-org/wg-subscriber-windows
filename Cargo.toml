[package]
name = "wg-subscriber-windows"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/automate-org/wg-subscriber-windows"
description = "Windows WireGuard subscriber client using MQTT for dynamic configuration."
keywords = ["wireguard", "vpn", "mqtt", "windows", "client"]
categories = ["network-programming", "command-line-utilities"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
local-ip-address = "0.6"
ipnet = "2.9"
anyhow = "1"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
rumqttc = { version = "0.24", features = ["use-rustls"] }
tempfile = "3"
zstd = "0.13"
blake3 = "1"
hostname = "0.4"
ctrlc = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rustls = "0.22"
rustls-pemfile = "1.0"
rustls-native-certs = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
